    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guru Prasath C — MERN Stack Developer & Competitive Programmer</title>
    <meta name="description" content="Portfolio of Guru Prasath C, MERN Stack Developer, Competitive Programmer, and Agentic AI Explorer. B.E. CSE Student at KKIT Coimbatore." />
    
    <!-- Open Graph / Social Media -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.15.1/devicon.min.css">

    <!-- Anti-Flash Theme Script -->
    <script>
      (function() {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950 transition-colors duration-300 min-h-screen overflow-x-hidden">

  </body>
